<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Chat — funny_nourr</title>

    <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #chat {
            position: absolute;

            inset: 0;

            display: flex;
            flex-direction: column;

            justify-content: flex-end;

            padding: 18px 16px;

            overflow: hidden;

            background: #000;
        }

        .message {
            width: 100%;

            margin: 5px 0;

            padding: 7px 10px;

            font-size: 25px;
            line-height: 1.25;

            font-weight: 500;

            color: #fff;

            word-wrap: break-word;

            animation: appear 0.18s ease-out;

            text-shadow:
                0 1px 2px rgba(0,0,0,0.9);
        }

        .username {
            font-weight: 800;

            margin-right: 8px;
        }

        .text {
            color: #fff;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Téléphone */
        @media (max-width: 600px) {

            #chat {
                padding: 12px 10px;
            }

            .message {
                font-size: 24px;

                margin: 4px 0;

                padding: 6px 7px;
            }
        }

        /* Très petit téléphone */
        @media (max-width: 380px) {

            .message {
                font-size: 21px;
            }
        }

        /* Tablette / grand écran */
        @media (min-width: 700px) {

            .message {
                font-size: 30px;
            }
        }

        /* Sélection désactivée */
        body {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>

    <div id="chat"></div>

    <script>

        const CHANNEL = "funny_nourr";

        const MAX_MESSAGES = 35;

        const chat = document.getElementById("chat");

        /*
         * Connexion au chat Twitch
         *
         * Aucun compte Twitch n'est nécessaire.
         */

        const client = new tmi.Client({
            connection: {
                secure: true,
                reconnect: true
            },

            channels: [CHANNEL]
        });

        /*
         * Connexion
         */

        client.connect().catch(console.error);


        /*
         * Réception des messages
         */

        client.on("message", (channel, tags, message, self) => {

            if (self) return;

            addMessage(tags, message);

        });


        /*
         * Ajoute un message à l'écran
         */

        function addMessage(tags, message) {

            const element = document.createElement("div");

            element.className = "message";


            /*
             * Couleur du pseudo
             */

            let usernameColor = tags.color;

            if (!usernameColor) {

                usernameColor = "#ffffff";

            }


            /*
             * Pseudo
             */

            const username = document.createElement("span");

            username.className = "username";

            username.textContent =
                tags["display-name"] ||
                tags.username ||
                "Viewer";

            username.style.color = usernameColor;


            /*
             * Message
             */

            const text = document.createElement("span");

            text.className = "text";

            text.textContent = message;


            /*
             * Assemblage
             */

            element.appendChild(username);

            element.appendChild(text);

            chat.appendChild(element);


            /*
             * Limite du nombre de messages
             */

            while (chat.children.length > MAX_MESSAGES) {

                chat.removeChild(chat.firstChild);

            }


            /*
             * Toujours rester en bas
             */

            requestAnimationFrame(() => {

                chat.scrollTop = chat.scrollHeight;

            });

        }


        /*
         * Reconnexion automatique
         */

        client.on("disconnected", () => {

            console.log("Déconnecté de Twitch...");

        });

        client.on("connected", () => {

            console.log("Connecté au chat Twitch !");

        });

    </script>

</body>
</html>
